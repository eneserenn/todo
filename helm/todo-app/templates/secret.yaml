apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ .Values.app.nextauthSecret | quote }}
  DATABASE_URL: {{ include "todo-app.databaseUrl" . | quote }}
  {{- if .Values.app.localLlmApiKey }}
  LOCAL_LLM_API_KEY: {{ .Values.app.localLlmApiKey | quote }}
  {{- end }}
---
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.dbFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
{{- end }}
