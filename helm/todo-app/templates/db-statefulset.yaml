{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "todo-app.dbFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "todo-app.dbFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "todo-app.dbSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo-app.dbSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      serviceAccountName: {{ include "todo-app.serviceAccountName" . }}

      securityContext:
        {{- include "todo-app.podSecurityContext" . | nindent 8 }}
        # PostgreSQL data directory must be writable by the running user.
        # fsGroup ensures the volume is writable by group 0 (compatible with
        # OpenShift's anyuid / restricted-v2 SCC).
        fsGroup: 0

      containers:
        - name: postgresql
          # Use the official Bitnami PostgreSQL image which supports
          # arbitrary UIDs out of the box (OpenShift-compatible)
          image: bitnami/postgresql:15
          imagePullPolicy: IfNotPresent

          securityContext:
            {{- include "todo-app.securityContext" . | nindent 12 }}

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "todo-app.dbFullname" . }}
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "todo-app.dbFullname" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "todo-app.dbFullname" . }}
                  key: POSTGRES_DB
            # Bitnami image uses PGDATA=/bitnami/postgresql/data
            - name: PGDATA
              value: /bitnami/postgresql/data

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRESQL_USERNAME -d $POSTGRESQL_DATABASE
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRESQL_USERNAME -d $POSTGRESQL_DATABASE
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources.db | nindent 12 }}

          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.storageClass }}
        storageClassName: {{ .Values.postgresql.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
{{- end }}
